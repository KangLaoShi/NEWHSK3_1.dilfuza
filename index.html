                                            <button 
                                                onClick={() => playAudio(line.zh)}
                                                className="p-2 bg-slate-700 text-slate-300 rounded-full group-hover:bg-amber-500 group-hover:text-slate-900 transition-colors"
                                            >
                                                <Volume2 size={20} />
                                            </button>
                                        </div>
                                        <div className="flex-1 space-y-2">
                                            <p className="text-sm font-semibold text-amber-500/80 uppercase tracking-wider">{line.speaker}</p>
                                            <p className="text-2xl font-medium text-slate-100">{line.zh}</p>
                                            <p className="text-lg text-amber-200/80 font-mono">{line.py}</p>
                                            <div className="space-y-1 pt-2 mt-2 border-t border-slate-700/50 text-sm">
                                                <p className="text-slate-300"><span className="text-slate-500 w-8 inline-block">UZ:</span> {line.uz}</p>
                                                <p className="text-slate-300"><span className="text-slate-500 w-8 inline-block">RU:</span> {line.ru}</p>
                                                <p className="text-slate-300"><span className="text-slate-500 w-8 inline-block">EN:</span> {line.en}</p>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    ))}
                </div>
            );
        };

        const Grammar = () => {
            return (
                <div className="max-w-4xl mx-auto space-y-10 pb-12">
                    {GRAMMAR.map((rule, idx) => (
                        <div key={idx} className="bg-white/5 backdrop-blur-md border border-white/10 rounded-3xl p-8 shadow-xl">
                            <h3 className="text-2xl font-bold text-amber-400 mb-6 pb-4 border-b border-white/10">{rule.title}</h3>
                            <div className="space-y-3 mb-8 text-slate-300">
                                <p><span className="font-semibold text-slate-400 mr-2">UZ:</span>{rule.uz}</p>
                                <p><span className="font-semibold text-slate-400 mr-2">RU:</span>{rule.ru}</p>
                                <p><span className="font-semibold text-slate-400 mr-2">EN:</span>{rule.en}</p>
                            </div>
                            <div className="bg-slate-900/50 rounded-2xl p-6 border border-slate-700/50">
                                <h4 className="text-sm font-bold text-slate-400 uppercase tracking-wider mb-4">Misollar (Examples)</h4>
                                <ul className="space-y-5">
                                    {rule.examples.map((ex, eIdx) => (
                                        <li key={eIdx} className="flex flex-col space-y-1 border-l-2 border-amber-500/50 pl-4">
                                            <div className="flex items-center space-x-3">
                                                <button onClick={() => playAudio(ex.zh)} className="text-slate-400 hover:text-amber-400 transition-colors">
                                                    <Volume2 size={18} />
                                                </button>
                                                <span className="text-xl font-medium text-slate-100">{ex.zh}</span>
                                            </div>
                                            <span className="text-amber-200/70 ml-7">{ex.py}</span>
                                            <span className="text-slate-400 text-sm ml-7 italic">{ex.uz}</span>
                                        </li>
                                    ))}
                                </ul>
                            </div>
                        </div>
                    ))}
                </div>
            );
        };

        // --- MAIN APP ---

        const App = () => {
            const [activeTab, setActiveTab] = useState('flashcards');

            const tabs = [
                { id: 'flashcards', label: "Lug'at", icon: BookOpen },
                { id: 'dialogues', label: "Muloqot", icon: MessageCircle },
                { id: 'grammar', label: "Grammatika", icon: BookText },
                { id: 'vocabTest', label: "Lug'at Testi", icon: FileQuestion },
                { id: 'grammarTest', label: "Grammatika Testi", icon: HelpCircle },
                { id: 'fillBlanks', label: "So'zlarni To'ldirish", icon: PenTool },
            ];

            return (
                <div>
                    <header className="pt-12 pb-8 px-6 text-center border-b border-white/5 bg-slate-900/20 shadow-lg backdrop-blur-sm sticky top-0 z-10">
                        <h1 className="text-4xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-200 to-amber-500 mb-4 drop-shadow-sm">
                            我们去机场接你们 (We will pick you up at the airport)
                        </h1>
                        <h2 className="text-lg md:text-xl font-medium text-indigo-200/80 tracking-wide">
                            Dilfuza Kāng lǎo shī bilan xitoy tilini o'rganmiz
                        </h2>
                    </header>

                    <main className="container mx-auto px-4 py-8 min-h-[calc(100vh-250px)]">
                        <div className="flex flex-wrap justify-center gap-3 mb-10">
                            {tabs.map((tab) => {
                                const Icon = tab.icon;
                                const isActive = activeTab === tab.id;
                                return (
                                    <button
                                        key={tab.id}
                                        onClick={() => setActiveTab(tab.id)}
                                        className={`flex items-center px-5 py-3 rounded-full text-sm font-semibold transition-all duration-300 
                                            ${isActive 
                                                ? 'bg-amber-500 text-slate-900 shadow-[0_0_20px_rgba(245,158,11,0.4)] scale-105' 
                                                : 'bg-white/5 text-slate-400 hover:bg-white/10 hover:text-slate-200 border border-white/5 hover:border-white/20'}`}
                                    >
                                        <Icon size={18} className="mr-2" />
                                        {tab.label}
                                    </button>
                                );
                            })}
                        </div>

                        <div className="animate-fade-in-up">
                            {activeTab === 'flashcards' && <Flashcards />}
                            {activeTab === 'dialogues' && <Dialogues />}
                            {activeTab === 'grammar' && <Grammar />}
                            
                            {/* MUST ADD KEY PROP TO PREVENT COMPONENT CRASHES ON TAB SWITCH */}
                            {activeTab === 'vocabTest' && <QuizComponent key="vocab" data={VOCAB_TEST} isVocab={true} />}
                            {activeTab === 'grammarTest' && <QuizComponent key="grammar" data={GRAMMAR_TEST} isVocab={false} />}
                            {activeTab === 'fillBlanks' && <QuizComponent key="fill" data={FILL_BLANKS} isVocab={false} />}
                        </div>
                    </main>

                    <footer className="border-t border-white/10 bg-slate-950/80 backdrop-blur-lg py-8 text-center">
                        <p className="text-slate-400 font-medium tracking-wide">HSK 3 NEW3.0 - Lesson 1</p>
                        <p className="text-slate-500 mt-2 text-sm">© 2026 Dilfuza Kāng lǎo shī (telegram@diffila)</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
